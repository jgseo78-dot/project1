<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 회의록 작성기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }
  
  h1 {
    font-size: 2rem;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #ff6b6b, #feca57);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .subtitle {
    color: rgba(255,255,255,0.6);
    margin-bottom: 28px;
    font-size: 0.95rem;
    text-align: center;
  }
  
  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 700px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    margin-bottom: 20px;
  }
  
  .section-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.95);
  }
  
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  
  @media (max-width: 600px) {
    .form-row { grid-template-columns: 1fr; }
  }
  
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  
  .form-label {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.7);
  }
  
  .form-input, .form-textarea {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 10px 12px;
    color: white;
    font-size: 0.9rem;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  
  .form-input:focus, .form-textarea:focus {
    outline: none;
    border-color: rgba(255,107,107,0.5);
  }
  
  .form-textarea { resize: vertical; min-height: 60px; }
  
  .info-banner {
    background: rgba(254,202,87,0.1);
    border: 1px solid rgba(254,202,87,0.3);
    color: #ffe08a;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.82rem;
    margin-bottom: 16px;
    line-height: 1.5;
  }
  
  .timer {
    font-size: 2.5rem;
    font-weight: 200;
    text-align: center;
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
  }
  
  .waveform-container {
    height: 60px;
    margin-bottom: 16px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    padding: 0 16px;
    overflow: hidden;
  }
  
  canvas { width: 100%; height: 100%; }
  
  .current-speaker-display {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  
  .current-speaker-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.88rem;
  }
  
  .speaker-badge {
    color: white;
    padding: 4px 12px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 0.82rem;
    white-space: nowrap;
  }
  
  .pitch-display {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums;
  }
  
  .live-transcript {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
    min-height: 100px;
    max-height: 220px;
    overflow-y: auto;
    font-size: 0.92rem;
    line-height: 1.6;
  }
  
  .live-transcript .placeholder {
    color: rgba(255,255,255,0.3);
    font-style: italic;
  }
  
  .live-transcript .interim { color: rgba(255,255,255,0.5); }
  
  .transcript-line {
    margin-bottom: 6px;
    padding: 4px 0;
  }
  
  .transcript-speaker {
    font-weight: 600;
    margin-right: 6px;
  }
  
  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;
    margin-bottom: 16px;
  }
  
  .record-btn {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #ff6b6b, #ee5a52);
    color: white;
    font-size: 1.9rem;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 24px rgba(238,90,82,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .record-btn:hover:not(:disabled) { transform: scale(1.05); }
  .record-btn:active { transform: scale(0.95); }
  
  .record-btn.recording {
    animation: pulse 1.5s infinite;
    background: linear-gradient(135deg, #ff4757, #c44569);
  }
  
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(238,90,82,0.4); }
    50% { box-shadow: 0 8px 40px rgba(238,90,82,0.9), 0 0 0 12px rgba(238,90,82,0.1); }
  }
  
  .secondary-btn {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: white;
    font-size: 1.15rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .secondary-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.15);
    transform: scale(1.05);
  }
  
  .secondary-btn:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  
  .status {
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 0.88rem;
    min-height: 20px;
  }
  
  .meetings-section { width: 100%; max-width: 700px; }
  
  .meetings-section h2 {
    font-size: 1.05rem;
    margin-bottom: 14px;
    color: rgba(255,255,255,0.9);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .meeting-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
  }
  
  .meeting-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 8px;
  }
  
  .meeting-title {
    font-size: 1rem;
    font-weight: 600;
    flex: 1;
    color: #feca57;
  }
  
  .meeting-meta {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.5);
    white-space: nowrap;
  }
  
  .meeting-info {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.6);
    margin-bottom: 10px;
    line-height: 1.5;
  }
  
  audio {
    width: 100%;
    height: 34px;
    margin-bottom: 10px;
  }
  
  .speaker-mapping {
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  
  .speaker-mapping-title {
    font-size: 0.82rem;
    color: rgba(255,255,255,0.7);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  
  .mapping-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  
  .mapping-row:last-child { margin-bottom: 0; }
  
  .mapping-row .speaker-badge {
    flex-shrink: 0;
    min-width: 70px;
    text-align: center;
  }
  
  .mapping-input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    padding: 6px 10px;
    color: white;
    font-size: 0.85rem;
  }
  
  .mapping-input:focus {
    outline: none;
    border-color: rgba(255,107,107,0.5);
  }
  
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  
  .tab {
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    padding: 8px 14px;
    cursor: pointer;
    font-size: 0.85rem;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  
  .tab:hover { color: rgba(255,255,255,0.8); }
  .tab.active {
    color: #feca57;
    border-bottom-color: #feca57;
  }
  
  .tab-content {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 10px;
    font-size: 0.9rem;
    line-height: 1.65;
    max-height: 320px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  
  .tab-content.empty {
    color: rgba(255,255,255,0.4);
    font-style: italic;
    text-align: center;
    padding: 20px;
  }
  
  .minutes-content h3 {
    color: #feca57;
    font-size: 0.95rem;
    margin-top: 12px;
    margin-bottom: 6px;
  }
  .minutes-content h3:first-child { margin-top: 0; }
  
  .minutes-content ul {
    margin-left: 18px;
    margin-bottom: 8px;
  }
  
  .minutes-content li { margin-bottom: 4px; }
  
  .action-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  
  .action-btn {
    flex: 1;
    min-width: 100px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.05);
    color: white;
    font-size: 0.83rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .action-btn:hover:not(:disabled) { background: rgba(255,255,255,0.12); }
  .action-btn.danger:hover { background: rgba(255,71,87,0.2); border-color: #ff4757; }
  .action-btn.primary {
    background: linear-gradient(135deg, rgba(255,107,107,0.25), rgba(254,202,87,0.25));
    border-color: rgba(255,107,107,0.4);
    font-weight: 600;
  }
  .action-btn.primary:hover {
    background: linear-gradient(135deg, rgba(255,107,107,0.4), rgba(254,202,87,0.4));
  }
  .action-btn.refine {
    background: linear-gradient(135deg, rgba(76,175,254,0.25), rgba(110,89,255,0.25));
    border-color: rgba(76,175,254,0.4);
    font-weight: 600;
  }
  .action-btn.refine:hover {
    background: linear-gradient(135deg, rgba(76,175,254,0.4), rgba(110,89,255,0.4));
  }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  
  .empty-state {
    text-align: center;
    color: rgba(255,255,255,0.4);
    padding: 24px;
    font-size: 0.9rem;
  }
  
  .error {
    background: rgba(255,71,87,0.15);
    border: 1px solid rgba(255,71,87,0.3);
    color: #ff8a95;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    font-size: 0.85rem;
    text-align: center;
  }
  
  .loading {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  
  @keyframes spin { to { transform: rotate(360deg); } }
  
  details {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
  }
  
  details summary {
    cursor: pointer;
    font-size: 0.88rem;
    color: rgba(255,255,255,0.8);
    user-select: none;
  }
  
  details[open] summary { margin-bottom: 10px; }
  
  .sensitivity-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.7);
  }
  
  .sensitivity-row input[type="range"] {
    flex: 1;
    accent-color: #ff6b6b;
  }
</style>
</head>
<body>
  <h1>📋 AI 회의록 작성기</h1>
  <p class="subtitle">자동 화자 분리 · 실시간 STT · AI 요약</p>
  
  <!-- 회의 정보 입력 -->
  <div class="card">
    <details open>
      <summary>📝 회의 정보 입력 (선택)</summary>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">회의 제목</label>
          <input type="text" class="form-input" id="meetingTitle" placeholder="예: 5월 기획 회의">
        </div>
        <div class="form-group">
          <label class="form-label">일시</label>
          <input type="text" class="form-input" id="meetingDate" placeholder="자동 입력됨">
        </div>
      </div>
      <div class="form-group" style="margin-bottom: 12px;">
        <label class="form-label">안건</label>
        <textarea class="form-textarea" id="meetingAgenda" placeholder="회의에서 다룰 주요 안건"></textarea>
      </div>
      <div class="sensitivity-row">
        <span>화자 구분 민감도:</span>
        <span style="font-size:0.78rem;color:rgba(255,255,255,0.5)">낮음</span>
        <input type="range" id="sensitivitySlider" min="10" max="50" value="25" step="1">
        <span style="font-size:0.78rem;color:rgba(255,255,255,0.5)">높음</span>
        <span id="sensitivityValue" style="min-width:30px;text-align:right">25</span>
      </div>
    </details>
  </div>
  
  <!-- 녹음 컨트롤 -->
  <div class="card">
    <div class="section-title">🎙️ 녹음</div>
    
    <div class="info-banner">
      💡 <strong>자동 화자 분리:</strong> 목소리 피치를 분석해서 화자를 자동으로 구분합니다.<br>
      녹음 후 ✨ <strong>AI 요약</strong>으로 회의 내용을 자동 정리할 수 있어요.
    </div>
    
    <div class="timer" id="timer">00:00</div>
    
    <div class="waveform-container">
      <canvas id="waveform"></canvas>
    </div>
    
    <div class="current-speaker-display">
      <div class="current-speaker-info">
        <span style="color:rgba(255,255,255,0.5);font-size:0.8rem">🗣️ 현재 화자:</span>
        <span class="speaker-badge" id="currentSpeakerBadge" style="background:rgba(255,255,255,0.15)">대기 중</span>
      </div>
      <div class="pitch-display" id="pitchDisplay">— Hz</div>
    </div>
    
    <div class="live-transcript" id="liveTranscript">
      <span class="placeholder">녹음을 시작하면 화자별로 텍스트가 표시됩니다...</span>
    </div>
    
    <div class="controls">
      <button class="secondary-btn" id="pauseBtn" disabled title="일시정지">⏸</button>
      <button class="record-btn" id="recordBtn" title="녹음">🎤</button>
      <button class="secondary-btn" id="stopBtn" disabled title="정지">⏹</button>
    </div>
    
    <div class="status" id="status">녹음 준비 완료</div>
    <div id="errorBox"></div>
  </div>
  
  <!-- 회의록 목록 -->
  <div class="meetings-section">
    <h2>📚 저장된 회의록 <span id="count" style="color:rgba(255,255,255,0.4);font-weight:normal;font-size:0.9rem"></span></h2>
    <div id="meetingsList">
      <div class="empty-state">아직 저장된 회의록이 없습니다</div>
    </div>
  </div>

<script>
  // ============ 상태 변수 ============
  let mediaRecorder = null;
  let audioChunks = [];
  let stream = null;
  let audioContext = null;
  let analyser = null;
  let timeDataArray = null;
  let animationId = null;
  let startTime = 0;
  let elapsedTime = 0;
  let timerInterval = null;
  let isPaused = false;
  let isRecording = false;
  let meetings = [];
  
  let recognition = null;
  let sttSupported = false;
  let restartTimer = null;
  
  // 화자 분리 관련
  let detectedSpeakers = []; // [{id: '화자1', avgPitch: 120, samples: 15}]
  let currentSpeakerId = null;
  let recentPitches = []; // 최근 측정한 피치들 (스무딩용)
  let pitchAnalysisInterval = null;
  let lastSpeakerChangeTime = 0;
  let sensitivity = 25; // Hz, 화자 구분 임계값
  
  let transcriptLines = []; // {speaker, text} 배열
  let pendingInterim = '';
  
  // 화자 색상 팔레트
  const SPEAKER_COLORS = [
    'linear-gradient(135deg, #ff6b6b, #ee5a52)',
    'linear-gradient(135deg, #4facfe, #00f2fe)',
    'linear-gradient(135deg, #43e97b, #38f9d7)',
    'linear-gradient(135deg, #fa709a, #fee140)',
    'linear-gradient(135deg, #a18cd1, #fbc2eb)',
    'linear-gradient(135deg, #fccb90, #d57eeb)',
    'linear-gradient(135deg, #84fab0, #8fd3f4)',
    'linear-gradient(135deg, #ffecd2, #fcb69f)'
  ];
  
  function getSpeakerColor(speakerId) {
    const idx = parseInt(speakerId.replace(/[^\d]/g, '')) - 1;
    return SPEAKER_COLORS[idx % SPEAKER_COLORS.length];
  }
  
  function getSpeakerTextColor(speakerId) {
    const idx = parseInt(speakerId.replace(/[^\d]/g, '')) - 1;
    const colors = ['#ff8a8a', '#6fc3ff', '#5eeb9d', '#ff9bbf', '#c2b0e8', '#f5c97a', '#a7f0c8', '#ffd0a8'];
    return colors[idx % colors.length];
  }
  
  // ============ DOM 요소 ============
  const recordBtn = document.getElementById('recordBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const stopBtn = document.getElementById('stopBtn');
  const timerEl = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const errorBox = document.getElementById('errorBox');
  const canvas = document.getElementById('waveform');
  const ctx = canvas.getContext('2d');
  const meetingsList = document.getElementById('meetingsList');
  const countEl = document.getElementById('count');
  const liveTranscript = document.getElementById('liveTranscript');
  const meetingTitleEl = document.getElementById('meetingTitle');
  const meetingDateEl = document.getElementById('meetingDate');
  const meetingAgendaEl = document.getElementById('meetingAgenda');
  const currentSpeakerBadge = document.getElementById('currentSpeakerBadge');
  const pitchDisplay = document.getElementById('pitchDisplay');
  const sensitivitySlider = document.getElementById('sensitivitySlider');
  const sensitivityValue = document.getElementById('sensitivityValue');
  
  sensitivitySlider.addEventListener('input', () => {
    sensitivity = parseInt(sensitivitySlider.value);
    sensitivityValue.textContent = sensitivity;
  });
  
  function getNowString() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  meetingDateEl.value = getNowString();
  
  // STT 지원 확인
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRecognition) {
    sttSupported = true;
  } else {
    liveTranscript.innerHTML = '<span class="placeholder">⚠️ Chrome 또는 Edge 브라우저를 사용해주세요.</span>';
  }
  
  // 캔버스 설정
  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  // ============ 유틸리티 ============
  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
  
  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const min = Math.floor(totalSec / 60).toString().padStart(2, '0');
    const sec = (totalSec % 60).toString().padStart(2, '0');
    return `${min}:${sec}`;
  }
  
  function updateTimer() {
    const now = Date.now();
    const total = elapsedTime + (isPaused ? 0 : now - startTime);
    timerEl.textContent = formatTime(total);
  }
  
  function showError(msg) {
    errorBox.innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
    setTimeout(() => { errorBox.innerHTML = ''; }, 6000);
  }
  
  // ============ 피치 검출 (자기상관 알고리즘) ============
  function detectPitch(buffer, sampleRate) {
    const SIZE = buffer.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) {
      rms += buffer[i] * buffer[i];
    }
    rms = Math.sqrt(rms / SIZE);
    
    // 너무 조용하면 무음으로 간주
    if (rms < 0.01) return -1;
    
    // 자기상관(autocorrelation)
    let bestOffset = -1;
    let bestCorrelation = 0;
    let foundGoodCorrelation = false;
    
    // 사람 목소리 범위: 75Hz ~ 400Hz
    const minOffset = Math.floor(sampleRate / 400);
    const maxOffset = Math.floor(sampleRate / 75);
    
    let lastCorrelation = 1;
    for (let offset = minOffset; offset < maxOffset; offset++) {
      let correlation = 0;
      for (let i = 0; i < SIZE - offset; i++) {
        correlation += Math.abs(buffer[i] - buffer[i + offset]);
      }
      correlation = 1 - (correlation / (SIZE - offset));
      
      if (correlation > 0.9 && correlation > lastCorrelation) {
        foundGoodCorrelation = true;
        if (correlation > bestCorrelation) {
          bestCorrelation = correlation;
          bestOffset = offset;
        }
      } else if (foundGoodCorrelation) {
        return sampleRate / bestOffset;
      }
      lastCorrelation = correlation;
    }
    
    if (bestCorrelation > 0.01) {
      return sampleRate / bestOffset;
    }
    return -1;
  }
  
  // ============ 화자 분리 로직 ============
  function identifySpeaker(pitch) {
    // 가장 가까운 기존 화자 찾기
    let bestMatch = null;
    let minDiff = Infinity;
    
    for (const sp of detectedSpeakers) {
      const diff = Math.abs(sp.avgPitch - pitch);
      if (diff < minDiff) {
        minDiff = diff;
        bestMatch = sp;
      }
    }
    
    // 임계값 이내면 같은 화자
    if (bestMatch && minDiff < sensitivity) {
      // 평균 업데이트 (점진적 학습)
      bestMatch.avgPitch = (bestMatch.avgPitch * bestMatch.samples + pitch) / (bestMatch.samples + 1);
      bestMatch.samples++;
      return bestMatch.id;
    }
    
    // 새 화자 추가
    const newId = `화자${detectedSpeakers.length + 1}`;
    detectedSpeakers.push({
      id: newId,
      avgPitch: pitch,
      samples: 1
    });
    return newId;
  }
  
  function analyzePitch() {
    if (!analyser || !timeDataArray) return;
    
    analyser.getFloatTimeDomainData(timeDataArray);
    const pitch = detectPitch(timeDataArray, audioContext.sampleRate);
    
    if (pitch > 0) {
      recentPitches.push(pitch);
      if (recentPitches.length > 5) recentPitches.shift();
      
      // 최소 3개 샘플 모이면 중앙값으로 안정화
      if (recentPitches.length >= 3) {
        const sorted = [...recentPitches].sort((a, b) => a - b);
        const median = sorted[Math.floor(sorted.length / 2)];
        
        const speakerId = identifySpeaker(median);
        pitchDisplay.textContent = `${Math.round(median)} Hz`;
        
        // 화자 전환 (너무 빠른 전환 방지: 최소 500ms 유지)
        const now = Date.now();
        if (speakerId !== currentSpeakerId && now - lastSpeakerChangeTime > 500) {
          currentSpeakerId = speakerId;
          lastSpeakerChangeTime = now;
          updateSpeakerBadge();
        } else if (!currentSpeakerId) {
          currentSpeakerId = speakerId;
          lastSpeakerChangeTime = now;
          updateSpeakerBadge();
        }
      }
    } else {
      // 무음
      recentPitches = [];
      pitchDisplay.textContent = '— Hz';
    }
  }
  
  function updateSpeakerBadge() {
    if (!currentSpeakerId) {
      currentSpeakerBadge.textContent = '대기 중';
      currentSpeakerBadge.style.background = 'rgba(255,255,255,0.15)';
    } else {
      currentSpeakerBadge.textContent = currentSpeakerId;
      currentSpeakerBadge.style.background = getSpeakerColor(currentSpeakerId);
    }
  }
  
  // ============ 파형 시각화 ============
  function drawWaveform() {
    if (!analyser) return;
    const bufferLength = analyser.frequencyBinCount;
    const dataArray = new Uint8Array(bufferLength);
    analyser.getByteFrequencyData(dataArray);
    
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    
    const barCount = 50;
    const barWidth = rect.width / barCount - 2;
    const step = Math.floor(bufferLength / barCount);
    
    for (let i = 0; i < barCount; i++) {
      const value = dataArray[i * step] / 255;
      const barHeight = Math.max(2, value * rect.height * 0.9);
      const x = i * (barWidth + 2);
      const y = (rect.height - barHeight) / 2;
      const gradient = ctx.createLinearGradient(0, y, 0, y + barHeight);
      gradient.addColorStop(0, '#ff6b6b');
      gradient.addColorStop(1, '#feca57');
      ctx.fillStyle = gradient;
      ctx.fillRect(x, y, barWidth, barHeight);
    }
    animationId = requestAnimationFrame(drawWaveform);
  }
  
  function drawIdle() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    const barCount = 50;
    const barWidth = rect.width / barCount - 2;
    for (let i = 0; i < barCount; i++) {
      ctx.fillRect(i * (barWidth + 2), rect.height / 2 - 1, barWidth, 2);
    }
  }
  drawIdle();
  
  // ============ 라이브 트랜스크립트 업데이트 ============
  function updateLiveTranscript() {
    if (transcriptLines.length === 0 && !pendingInterim) {
      liveTranscript.innerHTML = '<span class="placeholder">말씀하시면 텍스트가 여기에 표시됩니다...</span>';
      return;
    }
    
    let html = '';
    let prevSpeaker = null;
    let buffer = '';
    
    transcriptLines.forEach((line) => {
      if (line.speaker !== prevSpeaker) {
        if (buffer) {
          const color = getSpeakerTextColor(prevSpeaker || '화자1');
          html += `<div class="transcript-line"><span class="transcript-speaker" style="color:${color}">${escapeHtml(prevSpeaker || '미지정')}:</span>${escapeHtml(buffer)}</div>`;
        }
        buffer = line.text;
        prevSpeaker = line.speaker;
      } else {
        buffer += ' ' + line.text;
      }
    });
    if (buffer) {
      const color = getSpeakerTextColor(prevSpeaker || '화자1');
      html += `<div class="transcript-line"><span class="transcript-speaker" style="color:${color}">${escapeHtml(prevSpeaker || '미지정')}:</span>${escapeHtml(buffer)}</div>`;
    }
    
    if (pendingInterim) {
      const sp = currentSpeakerId || '미지정';
      const color = getSpeakerTextColor(sp);
      html += `<div class="transcript-line"><span class="transcript-speaker" style="color:${color}">${escapeHtml(sp)}:</span><span class="interim">${escapeHtml(pendingInterim)}</span></div>`;
    }
    
    liveTranscript.innerHTML = html;
    liveTranscript.scrollTop = liveTranscript.scrollHeight;
  }
  
  // ============ STT 제어 ============
  function startSTT() {
    if (!sttSupported) return;
    
    recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    
    recognition.onresult = (event) => {
      pendingInterim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          const trimmed = transcript.trim();
          if (trimmed) {
            transcriptLines.push({
              speaker: currentSpeakerId || '화자1',
              text: trimmed
            });
          }
        } else {
          pendingInterim += transcript;
        }
      }
      updateLiveTranscript();
    };
    
    recognition.onerror = (event) => {
      console.warn('STT 오류:', event.error);
      if (event.error === 'not-allowed') {
        showError('마이크 권한이 거부되어 텍스트 변환을 할 수 없습니다.');
      }
    };
    
    recognition.onend = () => {
      if (isRecording && !isPaused) {
        restartTimer = setTimeout(() => {
          try { recognition.start(); } catch (e) {}
        }, 100);
      }
    };
    
    try {
      recognition.start();
    } catch (e) {
      console.warn('STT 시작 실패:', e);
    }
  }
  
  function stopSTT() {
    if (restartTimer) {
      clearTimeout(restartTimer);
      restartTimer = null;
    }
    if (recognition) {
      try {
        recognition.onend = null;
        recognition.stop();
      } catch (e) {}
      recognition = null;
    }
  }
  
  // ============ 녹음 시작 ============
  async function startRecording() {
    try {
      errorBox.innerHTML = '';
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      timeDataArray = new Float32Array(analyser.fftSize);
      const source = audioContext.createMediaStreamSource(stream);
      source.connect(analyser);
      
      // 상태 초기화
      audioChunks = [];
      transcriptLines = [];
      pendingInterim = '';
      detectedSpeakers = [];
      currentSpeakerId = null;
      recentPitches = [];
      lastSpeakerChangeTime = 0;
      
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const url = URL.createObjectURL(blob);
        
        // 같은 화자 연속 발화 병합
        const merged = [];
        transcriptLines.forEach(line => {
          if (merged.length > 0 && merged[merged.length - 1].speaker === line.speaker) {
            merged[merged.length - 1].text += ' ' + line.text;
          } else {
            merged.push({ ...line });
          }
        });
        
        // 화자 이름 매핑 (초기: 화자1 → 화자1)
        const speakerMap = {};
        detectedSpeakers.forEach(sp => {
          speakerMap[sp.id] = sp.id;
        });
        
        const meeting = {
          id: Date.now(),
          title: meetingTitleEl.value.trim() || `회의 ${new Date().toLocaleString('ko-KR', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })}`,
          date: meetingDateEl.value.trim() || getNowString(),
          agenda: meetingAgendaEl.value.trim(),
          url: url,
          duration: formatTime(elapsedTime),
          size: (blob.size / 1024).toFixed(1) + ' KB',
          transcript: merged,
          originalTranscript: JSON.parse(JSON.stringify(merged)),
          detectedSpeakers: [...detectedSpeakers],
          speakerMap: speakerMap,
          summary: null,
          summaryLoading: false
        };
        meetings.unshift(meeting);
        renderMeetings();
        
        elapsedTime = 0;
        timerEl.textContent = '00:00';
        drawIdle();
        
        transcriptLines = [];
        pendingInterim = '';
        currentSpeakerId = null;
        updateSpeakerBadge();
        pitchDisplay.textContent = '— Hz';
        setTimeout(() => updateLiveTranscript(), 1500);
        
        meetingTitleEl.value = '';
        meetingAgendaEl.value = '';
        meetingDateEl.value = getNowString();
      };
      
      mediaRecorder.start();
      isRecording = true;
      startTime = Date.now();
      elapsedTime = 0;
      isPaused = false;
      
      startSTT();
      timerInterval = setInterval(updateTimer, 100);
      drawWaveform();
      pitchAnalysisInterval = setInterval(analyzePitch, 100); // 100ms마다 피치 분석
      
      recordBtn.classList.add('recording');
      recordBtn.innerHTML = '⏺';
      recordBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
      statusEl.textContent = '🔴 녹음 + 자동 화자 분리 중...';
      
    } catch (err) {
      console.error(err);
      if (err.name === 'NotAllowedError') {
        showError('마이크 권한이 거부되었습니다. 브라우저 설정에서 권한을 허용해주세요.');
      } else if (err.name === 'NotFoundError') {
        showError('마이크를 찾을 수 없습니다.');
      } else {
        showError('녹음을 시작할 수 없습니다: ' + err.message);
      }
    }
  }
  
  function pauseRecording() {
    if (!mediaRecorder) return;
    
    if (mediaRecorder.state === 'recording') {
      mediaRecorder.pause();
      elapsedTime += Date.now() - startTime;
      isPaused = true;
      stopSTT();
      clearInterval(pitchAnalysisInterval);
      pauseBtn.innerHTML = '▶';
      statusEl.textContent = '⏸ 일시정지됨';
      cancelAnimationFrame(animationId);
    } else if (mediaRecorder.state === 'paused') {
      mediaRecorder.resume();
      startTime = Date.now();
      isPaused = false;
      if (sttSupported) startSTT();
      pitchAnalysisInterval = setInterval(analyzePitch, 100);
      pauseBtn.innerHTML = '⏸';
      statusEl.textContent = '🔴 녹음 중...';
      drawWaveform();
    }
  }
  
  function stopRecording() {
    if (!mediaRecorder) return;
    
    isRecording = false;
    if (!isPaused) elapsedTime += Date.now() - startTime;
    
    stopSTT();
    clearInterval(pitchAnalysisInterval);
    mediaRecorder.stop();
    stream.getTracks().forEach(t => t.stop());
    
    if (audioContext) audioContext.close();
    cancelAnimationFrame(animationId);
    clearInterval(timerInterval);
    
    recordBtn.classList.remove('recording');
    recordBtn.innerHTML = '🎤';
    recordBtn.disabled = false;
    pauseBtn.disabled = true;
    pauseBtn.innerHTML = '⏸';
    stopBtn.disabled = true;
    statusEl.textContent = '✅ 회의록이 저장되었습니다';
    isPaused = false;
  }
  
  // ============ 회의록 목록 렌더링 ============

        <div class="tab-content ${!hasTranscript ? 'empty' : ''}" id="content-transcript-${m.id}">${hasTranscript ? escapeHtml(transcriptText) : '변환된 텍스트가 없습니다'}</div>
        
        <div class="tab-content ${!m.summary ? 'empty' : 'minutes-content'}" id="content-summary-${m.id}" style="display:none">${m.summary ? m.summary : (m.summaryLoading ? '<div style="text-align:center"><span class="loading"></span>AI가 회의 내용을 요약하고 있습니다...</div>' : '아래 "AI 요약 생성" 버튼을 눌러 회의 내용을 자동 정리하세요.')}</div>

          <button class="action-btn primary" onclick="generateSummary(${m.id})" ${!hasTranscript || m.summaryLoading ? 'disabled' : ''}>
            ${m.summaryLoading ? '<span class="loading"></span>요약 중...' : (m.summary ? '🔄 요약 다시 생성' : '✨ AI 요약 생성')}
          </button>

          <button class="action-btn" onclick="downloadTranscript(${m.id})" ${!hasTranscript ? 'disabled' : ''}>📋 대화록 저장</button>
          <button class="action-btn" onclick="downloadAudio(${m.id})">🎵 음성</button>

    }).join('');
  }

  // ============ AI 요약 생성 ============

    // 최대 2번 재시도

        // 요약 탭으로 자동 전환
        setTimeout(() => {
          const summaryContent = document.getElementById(`content-summary-${id}`);
          const transcriptContent = document.getElementById(`content-transcript-${id}`);
          if (summaryContent && transcriptContent) {
            summaryContent.style.display = '';
            transcriptContent.style.display = 'none';
            const tabs = summaryContent.parentElement.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            tabs[1].classList.add('active');
          }
        }, 100);
        
        return; // 성공
        
      } catch (err) {
        console.error(`시도 ${attempt + 1} 실패:`, err);
        lastError = err;
        
        // 네트워크 오류면 재시도, 그 외엔 즉시 중단
        const isNetworkError = err.message.includes('Failed to fetch') || 
                                err.message.includes('NetworkError') ||
                                err.name === 'TypeError';
        if (!isNetworkError) break;
      }
    }
    
    // 모든 시도 실패
    m.summaryLoading = false;
    renderMeetings();
    
    let userMessage = 'AI 요약 생성 실패: ';
    if (lastError?.message.includes('Failed to fetch') || lastError?.name === 'TypeError') {
      userMessage += '네트워크 연결을 확인해주세요. 광고 차단 확장 프로그램을 잠시 끄거나, 시크릿/다른 브라우저로 시도해보세요.';
    } else {
      userMessage += (lastError?.message || '알 수 없는 오류');
    }
    showError(userMessage);
  };
  
  // ============ 다운로드 ============
  window.downloadAudio = function(id) {
    const m = meetings.find(x => x.id === id);
    if (!m) return;
    const a = document.createElement('a');
    a.href = m.url;
    a.download = m.title.replace(/[\/\\:*?"<>|]/g, '-') + '.webm';
    a.click();
  };
  
  window.downloadTranscript = function(id) {
    const m = meetings.find(x => x.id === id);
    if (!m) return;
    const transcriptText = m.transcript.map(l => {
      const displayName = m.speakerMap[l.speaker] || l.speaker;
      return `${displayName}: ${l.text}`;
    }).join('\n\n');
    const content = `[${m.title}]\n일시: ${m.date}\n${m.agenda ? `안건: ${m.agenda}\n` : ''}\n${'='.repeat(40)}\n\n${transcriptText}`;
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = m.title.replace(/[\/\\:*?"<>|]/g, '-') + '_대화록.txt';
    a.click();
    URL.revokeObjectURL(url);
  };
  
  window.downloadSummary = function(id) {
    const m = meetings.find(x => x.id === id);
    if (!m || !m.summary) return;
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = m.summary;
    let plainText = '';
    tempDiv.childNodes.forEach(node => {
      if (node.nodeName === 'H3') {
        plainText += '\n\n' + node.textContent + '\n' + '-'.repeat(30) + '\n';
      } else if (node.nodeName === 'P') {
        plainText += node.textContent + '\n';
      } else if (node.nodeName === 'UL') {
        node.querySelectorAll('li').forEach(li => {
          plainText += '• ' + li.textContent + '\n';
        });
      }
    });
    const content = `[${m.title}]\n일시: ${m.date}\n${m.agenda ? `안건: ${m.agenda}\n` : ''}\n${'='.repeat(40)}${plainText}`;
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = m.title.replace(/[\/\\:*?"<>|]/g, '-') + '_회의록.txt';
    a.click();
    URL.revokeObjectURL(url);
  };
  
  window.deleteMeeting = function(id) {
    if (!confirm('이 회의록을 삭제하시겠습니까?')) return;
    const m = meetings.find(x => x.id === id);
    if (m) URL.revokeObjectURL(m.url);
    meetings = meetings.filter(x => x.id !== id);
    renderMeetings();
  };
  
  // 이벤트 리스너
  recordBtn.addEventListener('click', startRecording);
  pauseBtn.addEventListener('click', pauseRecording);
  stopBtn.addEventListener('click', stopRecording);
</script>
</body>
</html>
